<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Metro Interactif</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <p>Data Viz SVG</p>
        <h1>Plan metro interactif</h1>
      </div>

      <div class="topbar-actions">
        <nav class="nav-links" aria-label="Navigation principale">
          <a class="active" href="index.html">Carte</a>
          <a href="route.html">Itineraire</a>
        </nav>
        <a class="admin-key-btn" href="admin.html" aria-label="Acceder au panel securise">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.9 3a6.1 6.1 0 0 0-4.83 9.83L3 19.9V22h2.1l1.5-1.5 1 1 1.4-1.4-1-1L9.9 17h2l1.63-1.63A6.1 6.1 0 1 0 14.9 3zm0 2a4.1 4.1 0 1 1 0 8.2 4.1 4.1 0 0 1 0-8.2z"></path>
          </svg>
        </a>
      </div>
    </header>

    <main class="page-content">
      <section class="panel">
        <div class="panel-head">
          <h2>Visualisation en temps reel</h2>
          <p>Carte SVG dynamique basee sur la topographie du reseau courant.</p>
        </div>
        <div class="panel-body stack">
          <div class="actions-row">
            <button id="simulate-update" type="button">Simuler update topographique</button>
            <button id="reset-view" type="button">Recentrer la vue</button>
            <button id="reload-bundle" class="warn" type="button">Recharger depuis stockage</button>
          </div>
          <p id="main-status" class="status-text">Survole une ligne ou une station pour explorer la carte.</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-body">
          <div class="map-shell">
            <svg id="metro-map" aria-label="Plan de metro dynamique"></svg>
          </div>
          <div id="main-tooltip" class="tooltip" aria-hidden="true"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/pages/indexPage.js"></script>
</body>
</html>
