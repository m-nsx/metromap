<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Metro Interactif</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <h1>UTILS</h1>
        <p>Unicorp Transportation, Infrastructure & Logistical Services</p>
      </div>

      <div class="topbar-actions">
        <nav class="nav-links" aria-label="Navigation principale">
          <a class="active" href="index.html">Carte</a>
          <a href="route.html">Itineraire</a>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <section class="panel">
        <div class="panel-head">
          <h2>Carte des transports - Lake City</h2>
          <p>Déplacez vous facilement sur l'ensemble de notre réseau</p>
        </div>
        <div class="panel-body stack">
          <div class="actions-row">
            <!-- <button id="simulate-update" type="button">Simuler update topographique</button> -->
            <button id="reset-view" type="button">Recentrer la vue</button>
            <!-- <button id="reload-bundle" class="warn" type="button">Recharger les données</button> -->
          </div>
          <p id="main-status" class="status-text">Survolez une ligne ou une station pour explorer la carte</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-body">
          <div class="map-shell">
            <svg id="metro-map" aria-label="Plan de metro dynamique"></svg>
          </div>
          <div id="main-tooltip" class="tooltip" aria-hidden="true"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/pages/indexPage.js"></script>
</body>
</html>
